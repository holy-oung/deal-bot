name: 📢 Daily System & Trend Reporter (매일 밤 11시 일일 리포트 발송)

on:
  schedule:
    # 매일 밤 11시(KST 23:00 = UTC 14:00)에 1회 자동 실행
    - cron: '0 14 * * *'
  workflow_dispatch: # 깃허브 웹 화면에서 [Run workflow] 클릭 시 즉시 1회 발송

jobs:
  send-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 2. 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 필수 패키지 설치
        run: |
          pip install requests

      - name: 4. 스레드 인사이트 분석, 일일 리포트 발송 및 피드백 강화 학습
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          python daily_reporter.py

      - name: 5. 내 계정 고성과 피드백 데이터 자동 커밋 & 푸시
        run: |
          git config --global user.name "deal-bot-learner"
          git config --global user.email "bot@dealbot.local"
          git add trend_timeline.jsonl dynamic_hook_pool.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [피드백강화] 내 계정 Top 성과 후킹 시계열 반영" && git push)
