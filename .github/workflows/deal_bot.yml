name: 🚀 Deal Bot Cloud Runner (무인 핫딜 알림기)

on:
  schedule:
    # 한국 시간(KST) 기준 오전 8시 ~ 밤 12시(자정) 사이 매시간 정각에 실행 (UTC 23시~15시)
    # 웜업 모드에서는 매시간 깨어나서 15% 확률로만 랜덤 포스팅합니다.
    - cron: '0 23,0-15 * * *'
  workflow_dispatch: # 깃허브 화면에서 [Run workflow] 버튼 클릭 시 즉시 1회 실행

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 2. 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 필수 패키지 설치
        run: |
          pip install -r requirements.txt

      - name: 4. 딜봇 실행 (웜업 모드)
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WARMUP_MODE: "true"
          ENABLE_THREADS_POSTING: "true"
        run: |
          python main.py --once


      - name: 5. 발송 기록(sent_deals.json) 저장소에 자동 저장
        run: |
          git config --global user.name "deal-bot-cloud"
          git config --global user.email "bot@dealbot.local"
          git add sent_deals.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [자동기록] 핫딜 발송 히스토리 갱신" && git push)
